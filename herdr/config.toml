onboarding = false

[theme]
name = "catppuccin"

auto_switch = false

[session]
resume_agents_on_restore = true

[theme.custom]
panel_bg = "#29273f"
surface0 = "#2a273f"
surface1 = "#393552"
surface_dim = "#1f1d30"
overlay0 = "#56526e"
text = "#c0bbce"
subtext0 = "#8a84a0"
accent = "#7287fd"

[keys]
# Match the tmux prefix used in ~/dotfiles/tmux/conf/keybindings.conf.
prefix = "ctrl+space"

# Only bind Herdr controls when they have a close tmux equivalent.
settings = "prefix+shift+s"
reload_config = "prefix+,"
toggle_sidebar = "prefix+e"
detach = ""
help = "prefix+?"
workspace_picker = "prefix+q"
goto = "prefix+ctrl+f"
edit_scrollback = "prefix+slash"
resize_mode = "prefix+shift+z"
new_worktree = "prefix+shift+g"
open_worktree = "prefix+ctrl+g"
previous_agent = "cmd+k"
next_agent = "cmd+j"
switch_workspace = "prefix+shift+1..9"

# Herdr tabs map most closely to tmux windows.
new_tab = "prefix+c"
previous_tab = "alt+h"
next_tab = "alt+l"
switch_tab = ["prefix+1..9", "alt+1..9"]
rename_tab = "prefix+r"
close_tab = "prefix+w"

# Herdr panes map to tmux panes.
split_vertical = "prefix+v"
split_horizontal = ["prefix+s", "prefix+minus"]
close_pane = "prefix+x"
zoom = "prefix+z"
copy_mode = "prefix+b"

# Pane focus is handled by the cross-pane Ctrl+h/j/k/l bindings below.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = "prefix+tab"
rename_pane = ""

# Herdr workspace layer mapped only where your tmux config has a session-like key.
new_workspace = "prefix+n"
rename_workspace = "prefix+period"
close_workspace = ""
previous_workspace = "alt+k"
next_workspace = "alt+j"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "exec \"${SHELL:-/bin/zsh}\" -l"
width = "55%"
height = "55%"
description = "open floating shell"

[[keys.command]]
key = "prefix+ctrl+n"
type = "shell"
command = "$HOME/dotfiles/bin/herdr-project-nvim"
description = "open Neovim in a Projects tab"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle the reviewr sidebar"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "hotchpotch.herdr-tiny-fingers.open"
description = "copy visible text using tmux-fingers-style hints"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/vim-herdr-navigation-fixed/navigate.sh left"
description = "navigate left across Neovim splits and Herdr panes"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/vim-herdr-navigation-fixed/navigate.sh down"
description = "navigate down across Neovim splits and Herdr panes"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/vim-herdr-navigation-fixed/navigate.sh up"
description = "navigate up across Neovim splits and Herdr panes"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/vim-herdr-navigation-fixed/navigate.sh right"
description = "navigate right across Neovim splits and Herdr panes"

# Native floating popups matching the tmux display-popup workflows.
[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = "cd \"${PROJECTS_DIR:-$HOME/Projects}\" && exec \"$HOME/dotfiles/bin/ghprs\" review"
width = "72%"
height = "65%"
description = "review PRs in a floating popup"

[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = "cd \"${PROJECTS_DIR:-$HOME/Projects}\" && exec \"$HOME/dotfiles/bin/ghprs\" mine"
width = "72%"
height = "65%"
description = "review PRs in a floating popup"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = "exec \"${SHELL:-/bin/zsh}\" -l"
width = "75%"
height = "75%"
description = "open temporary floating shell"

[[keys.command]]
key = "prefix+alt+q"
type = "popup"
command = "exec $HOME/dotfiles/tmux/scripts/llm-ask.sh"
width = "60%"
height = "50%"
description = "open quick LLM ask"

[[keys.command]]
key = "prefix+ctrl+a"
type = "popup"
command = "exec $HOME/dotfiles/tmux/scripts/quick-org-task.sh"
width = "55%"
height = "50%"
description = "open or create an org todo"

[[keys.command]]
key = "prefix+ctrl+c"
type = "pane"
command = "exec codex --yolo"
description = "open codex"

[[keys.command]]
key = "prefix+alt+r"
type = "popup"
command = "exec $HOME/dotfiles/bin/org-pi launch"
width = "72%"
height = "70%"
description = "select and launch an Org task with Pi"

[[keys.command]]
key = "prefix+ctrl+o"
type = "popup"
command = "exec $HOME/dotfiles/tmux/scripts/agenda-today.sh"
width = "65%"
height = "65%"
description = "open today agenda"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "exec $HOME/dotfiles/tmux/scripts/org-note-popup.sh"
width = "85%"
height = "80%"
description = "create new org plans"

[[keys.command]]
key = "prefix+ctrl+p"
type = "pane"
command = "exec posting --env \"$HOME/.local/share/posting/default/posting.env\""
description = "open Posting"

[[keys.command]]
key = "prefix+ctrl+j"
type = "pane"
command = "cd \"${JIRA_TUI_ROOT:-$HOME/Projects/jira-tui/bin}\" && exec \"${JIRA_TUI_BIN:-$HOME/.local/bin/jira-tui}\""
description = "open Jira TUI"

[[keys.command]]
key = "prefix+ctrl+b"
type = "popup"
command = "exec \"${BTOP_BIN:-/opt/homebrew/bin/btop}\""
width = "75%"
height = "75%"
description = "open btop"


[[keys.command]]
key = "prefix+o"
type = "popup"
command = "cd \"${JIRA_TUI_ROOT:-$HOME/Projects/jira-tui/bin}\" && exec \"${JIRA_TUI_BIN:-$HOME/.local/bin/jira-tui}\""
width = "75%"
height = "75%"
description = "open btop"
[[keys.command]]
key = "prefix+ctrl+y"
type = "pane"
command = "exec \"${YAZI_BIN:-yazi}\""
description = "open yazi"

[[keys.command]]
key = "prefix+ctrl+d"
type = "pane"
command = "exec /opt/homebrew/bin/lazydocker"
description = "open lazydocker"

[[keys.command]]
key = "prefix+ctrl+l"
type = "pane"
command = "exec $HOME/.local/bin/lmstat"
description = "open lmstat"

[ui]
prompt_new_tab_name = false
prompt_new_workspace_name = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
sidebar_width = 34
sidebar_max_width = 44

[ui.sidebar.agents]
row_gap = 1 
rows = [
  ["state_icon", "state_text", "agent"],
  ["workspace", "tab"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = false

