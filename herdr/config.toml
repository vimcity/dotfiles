onboarding = false

[theme]
name = "catppuccin"

auto_switch = false

[session]
resume_agents_on_restore = true

[theme.custom]
panel_bg = "#303446"
active_row_bg = "#51576d"
selection_bg = "#626880"
surface0 = "#414559"
surface1 = "#51576d"
surface_dim = "#292c3c"
overlay0 = "#626880"
text = "#c6d0f5"
subtext0 = "#a5adce"
accent = "#8caaee"

[keys]
prefix = "ctrl+space"

settings = "prefix+shift+s"
reload_config = "prefix+,"
toggle_sidebar = "prefix+e"
detach = "prefix+d"
help = "prefix+?"
workspace_picker = "prefix+q"
goto = "prefix+ctrl+f"
edit_scrollback = ""
resize_mode = "prefix+ctrl+z"
new_worktree = "prefix+shift+w"
open_worktree = "prefix+ctrl+w"
previous_agent = "cmd+k"
next_agent = "cmd+j"
switch_workspace = "prefix+shift+1..9"

new_tab = "prefix+c"
previous_tab = "alt+h"
next_tab = "alt+l"
switch_tab = ["prefix+1..9", "alt+1..9"]
rename_tab = "prefix+r"
close_tab = "prefix+w"

split_vertical = "prefix+v"
split_horizontal = ["prefix+s", "prefix+minus"]
close_pane = "prefix+x"
zoom = "prefix+z"
copy_mode = "prefix+b"

# Pane focus is handled by the cross-pane Ctrl+h/j/k/l bindings below.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = "prefix+tab"
rename_pane = ""
move_tab_previous = "prefix+shift+h"
move_tab_next = "prefix+shift+l"

new_workspace = "prefix+n"
rename_workspace = "prefix+period"
close_workspace = ""
previous_workspace = "alt+k"
next_workspace = "alt+j"

[[keys.command]]
key = "prefix+slash"
type = "pane"
command = "exec \"$HOME/dotfiles/herdr/scripts/scrollback-nvim.sh\""
description = "scrollback in nvim with tailspin highlighting"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "exec \"${SHELL:-/bin/zsh}\" -l"
width = "55%"
height = "55%"
description = "open floating shell"

[[keys.command]]
key = "prefix+ctrl+n"
type = "shell"
command = "$HOME/dotfiles/herdr/scripts/project-nvim.sh"
description = "open Neovim in a Projects tab"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle the reviewr sidebar"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "hotchpotch.herdr-tiny-fingers.open"
description = "copy visible text using tiny-fingers hints"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/vim-herdr-navigation-fixed/navigate.sh left"
description = "navigate left across Neovim splits and Herdr panes"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/vim-herdr-navigation-fixed/navigate.sh down"
description = "navigate down across Neovim splits and Herdr panes"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/vim-herdr-navigation-fixed/navigate.sh up"
description = "navigate up across Neovim splits and Herdr panes"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/dotfiles/herdr/plugins/vim-herdr-navigation-fixed/navigate.sh right"
description = "navigate right across Neovim splits and Herdr panes"

# Floating popups
# TODO: change this to open pi new sesison in the projects dir 
[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = "cd \"${PROJECTS_DIR:-$HOME/Projects}\" && exec \"$HOME/dotfiles/bin/ghprs\" review"
width = "72%"
height = "65%"
description = "review PRs in a floating popup"

# TODO: remove this and have navidrome music be launched in a bg pane in a space or somethign for music 
[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = "cd \"${PROJECTS_DIR:-$HOME/Projects}\" && exec \"$HOME/dotfiles/bin/ghprs\" mine"
width = "72%"
height = "65%"
description = "review PRs in a floating popup"

# TODO: imrprove first pane loading render thingy by loading the list of prs first and their comments, descriptions ,and diff later lazy loading or like later async
[[keys.command]]
key = "prefix+shift+g"
type = "pane"
command = "cd \"${PROJECTS_DIR:-$HOME/Projects}\" && exec \"${GH_PR_DASH_BIN:-$HOME/.local/bin/gh-pr-dash}\""
description = "open gh-pr-dash PR dashboard"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = "exec \"${SHELL:-/bin/zsh}\" -l"
width = "75%"
height = "75%"
description = "open temporary floating shell"

