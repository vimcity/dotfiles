[[keys.command]]
key = "prefix+ctrl+a"
type = "popup"
command = "exec $HOME/dotfiles/herdr/scripts/quick-org-task.sh"
width = "55%"
height = "50%"
description = "open or create an org todo"

[[keys.command]]
key = "prefix+ctrl+c"
type = "pane"
command = "exec codex --yolo"
description = "open codex"

# TODO: understand the use cases of this better, also herdr api for interacting with agents could replace the codex pi and this one 
[[keys.command]]
key = "prefix+shift+i"
type = "popup"
command = "exec $HOME/dotfiles/bin/org-pi launch"
width = "72%"
height = "70%"
description = "org task → Pi (org-pi launch)"

[[keys.command]]
key = "prefix+ctrl+o"
type = "pane"
command = "exec $HOME/dotfiles/herdr/scripts/agenda-today.sh"
# width = "65%"
# height = "65%"
description = "open today's org agenda"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "exec $HOME/dotfiles/herdr/scripts/org-note-popup.sh"
width = "85%"
height = "80%"
description = "create new org plans"

[[keys.command]]
key = "prefix+ctrl+p"
type = "pane"
command = "exec posting --env \"$HOME/.local/share/posting/default/posting.env\""
description = "open Posting"

[[keys.command]]
key = "prefix+ctrl+j"
type = "pane"
command = "cd \"${JIRA_TUI_ROOT:-$HOME/Projects/jira-tui/bin}\" && exec \"${JIRA_TUI_BIN:-$HOME/.local/bin/jira-tui}\""
description = "open Jira TUI"

[[keys.command]]
key = "prefix+ctrl+b"
type = "pane"
command = "exec \"${BTOP_BIN:-/opt/homebrew/bin/btop}\""
description = "open btop"

[[keys.command]]
key = "prefix+ctrl+y"
type = "pane"
command = "exec \"${YAZI_BIN:-yazi}\""
description = "open yazi"

[[keys.command]]
key = "prefix+ctrl+d"
type = "pane"
command = "exec /opt/homebrew/bin/lazydocker"
description = "open lazydocker"

[[keys.command]]
key = "prefix+ctrl+l"
type = "pane"
command = "exec $HOME/.local/bin/lmstat"
description = "open lmstat"

[ui]
pane_borders = true
pane_outer_borders = true
pane_gaps = true
status_indicators = "symbols"
tab_bar_right = [
  { type = "command", command = "$HOME/dotfiles/herdr/scripts/status-right.sh", interval_seconds = 5, timeout_seconds = 2 },
  { type = "text", text = " " },
]
prompt_new_tab_name = false
prompt_new_workspace_name = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
sidebar_width = 34
sidebar_max_width = 44

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "state_text", { token = "agent", fg = "#f2d5cf", bold = true }],
  [{ token = "workspace", fg = "#c6d0f5" }, { token = "tab", fg = "#babbf1" }],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = false
