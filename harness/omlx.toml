# Local oMLX profile. The normal Harness config remains unchanged.
provider = "open_ai"
model = "Qwen3.6-35B-A3B-OptiQ-4bit"

openai_base_url = "http://127.0.0.1:8000/v1"
openai_protocol = "chat_completions"

context_window = 262144
max_output_tokens = 8192

# Native calls are the most compatible starting point for local models.
tool_presentation = "native"
sandbox = true
